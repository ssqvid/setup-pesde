name: Action Test
on: 
  workflow_dispatch:
  push:
    paths:
      - '**.yml'
  pull_request:
    paths:
      - '**.yml'

defaults:
  run:
    shell: bash

jobs:
  test-cache:
    uses: ./.github/workflows/env.yml
    with:
      cache: true

  test-build:
    uses: ./.github/workflows/env.yml
    with:
      version: build

  test-version:
    uses: ./.github/workflows/env.yml
    with:
      version: 0.7.0-rc.6
